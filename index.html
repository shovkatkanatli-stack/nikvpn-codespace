<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Rainy Window · Café Nocturne</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }
html { background: #0b0e14; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: #e9edf4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  background:
    radial-gradient(130% 100% at 50% -12%, #1a2231 0%, rgba(11, 14, 20, 0) 58%),
    linear-gradient(180deg, #0d1119 0%, #0b0e14 52%, #090b11 100%);
  -webkit-font-smoothing: antialiased;
}

/* ---------- stage / canvas ---------- */
#stage { position: fixed; inset: 0; z-index: 0; }
#c {
  position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  touch-action: none; z-index: 0; background: transparent;
}

/* ---------- loading overlay ---------- */
#loading {
  position: fixed; inset: 0; z-index: 60;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  background:
    radial-gradient(60% 45% at 50% 42%, rgba(255, 180, 107, .08) 0%, rgba(11, 14, 20, 0) 70%),
    radial-gradient(130% 100% at 50% 0%, #151c29 0%, #0b0e14 68%);
  opacity: 1;
  transition: opacity .8s ease, visibility 0s linear 0s;
}
body.ready #loading {
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .8s ease, visibility 0s linear .8s;
}
.ld-title {
  margin: 0; font-size: 12px; font-weight: 500;
  letter-spacing: .32em; text-transform: uppercase; color: #a9b3c5;
}
.ld-bar {
  width: 220px; height: 3px; border-radius: 99px;
  background: rgba(255, 255, 255, .06); overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .03);
}
.ld-bar > i {
  display: block; width: 36%; height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, rgba(255, 180, 107, 0), #ffb46b 45%, #ff4fa3 75%, rgba(255, 79, 163, 0));
  animation: ldSlide 1.15s cubic-bezier(.65, .05, .35, .95) infinite;
}
@keyframes ldSlide {
  0% { transform: translateX(-110%); }
  100% { transform: translateX(330%); }
}

/* ---------- CSS-only fallback scene ---------- */
#fallback {
  position: fixed; inset: 0; z-index: 55; display: none;
  overflow: hidden; background: #0b0e14;
}
#fallback.show { display: block; }
.fb-layer { position: absolute; left: -8%; right: -8%; pointer-events: none; }
.fb-sky {
  top: 0; bottom: 0; left: 0; right: 0;
  background: linear-gradient(180deg, #0e1522 0%, #0b0e14 58%, #080b11 100%);
}
.fb-glow {
  top: 6%; height: 38%;
  background: radial-gradient(52% 58% at 50% 50%, rgba(255, 180, 107, .12) 0%, rgba(255, 79, 163, .05) 48%, rgba(11, 14, 20, 0) 78%);
}
.fb-city {
  top: 30%; bottom: 34%;
  background: repeating-linear-gradient(90deg, #0b1018 0 46px, #090d15 46px 61px, #0c1220 61px 103px, #080c13 103px 127px);
}
.fb-city::after {
  content: ""; position: absolute; inset: 0; opacity: .55;
  background:
    repeating-linear-gradient(90deg, rgba(255, 180, 107, .14) 0 3px, rgba(255, 180, 107, 0) 3px 46px),
    repeating-linear-gradient(180deg, rgba(255, 214, 170, .10) 0 6px, rgba(255, 214, 170, 0) 6px 27px);
}
.fb-street {
  bottom: 0; top: auto; height: 34%;
  background: linear-gradient(180deg, #0a0f18 0%, #070a10 100%);
}
.fb-street::after {
  content: ""; position: absolute; inset: 0; opacity: .5;
  background:
    repeating-linear-gradient(103deg, rgba(255, 180, 107, .05) 0 4px, rgba(255, 180, 107, 0) 4px 78px),
    linear-gradient(180deg, rgba(11, 14, 20, 0) 0%, rgba(11, 14, 20, .5) 100%);
}
.fb-rain {
  position: absolute; top: -30%; left: -30%; width: 160%; height: 160%;
  pointer-events: none;
}
.fb-rain.r1 {
  background-image: repeating-linear-gradient(to bottom, rgba(186, 201, 229, 0) 0 7px, rgba(186, 201, 229, .30) 7px 8px, rgba(186, 201, 229, 0) 8px 15px);
  animation: fbRainA .8s linear infinite;
}
.fb-rain.r2 {
  background-image: repeating-linear-gradient(to bottom, rgba(186, 201, 229, 0) 0 12px, rgba(186, 201, 229, .15) 12px 13px, rgba(186, 201, 229, 0) 13px 24px);
  animation: fbRainB 1.3s linear infinite;
}
@keyframes fbRainA {
  from { transform: skewX(-14deg) translate3d(0, 0, 0); }
  to   { transform: skewX(-14deg) translate3d(0, 15px, 0); }
}
@keyframes fbRainB {
  from { transform: skewX(-9deg) translate3d(0, 0, 0); }
  to   { transform: skewX(-9deg) translate3d(0, 24px, 0); }
}
.fb-msg {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center;
}
.fb-msg strong { font-size: 13px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: #dbe2ee; }
.fb-msg span { max-width: 44ch; font-size: 12.5px; line-height: 1.7; color: rgba(188, 198, 214, .6); }

/* ---------- glassmorphism control pill ---------- */
#ui {
  position: fixed; left: 50%; bottom: 24px; z-index: 30;
  transform: translate(-50%, 14px);
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-radius: 999px;
  background: rgba(15, 19, 27, .55);
  border: 1px solid rgba(255, 255, 255, .09);
  -webkit-backdrop-filter: blur(16px) saturate(1.35);
  backdrop-filter: blur(16px) saturate(1.35);
  box-shadow: 0 18px 50px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .07);
  opacity: 0;
  transition: opacity .7s ease, transform .7s cubic-bezier(.2, .7, .2, 1);
  user-select: none; -webkit-user-select: none;
}
body.ready #ui { opacity: 1; transform: translate(-50%, 0); }
body.uihidden #ui { opacity: 0; transform: translate(-50%, 14px); pointer-events: none; }
body.nogl #ui { display: none; }
#ui button {
  font: inherit; font-size: 10.5px; font-weight: 600;
  letter-spacing: .13em; text-transform: uppercase; color: #cfd6e4;
  background: rgba(255, 255, 255, .05);
  border: 1px solid rgba(255, 255, 255, .1); border-radius: 999px;
  padding: 8px 14px; cursor: pointer; white-space: nowrap;
  transition: background .25s ease, color .25s ease, border-color .25s ease, transform .12s ease;
}
#ui button:hover { background: rgba(255, 180, 107, .14); border-color: rgba(255, 180, 107, .35); color: #ffe6c9; }
#ui button:active { transform: translateY(1px); }
.ui-sep { width: 1px; height: 20px; background: rgba(255, 255, 255, .1); margin: 0 2px; }
#ui label {
  display: flex; align-items: center; gap: 9px;
  font-size: 9.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
  color: #8b95a9; cursor: pointer; white-space: nowrap;
}
#ui input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 86px; height: 14px; background: transparent; cursor: pointer; margin: 0;
}
#ui input[type="range"]::-webkit-slider-runnable-track {
  height: 3px; border-radius: 3px;
  background: linear-gradient(90deg, rgba(255, 180, 107, .85), rgba(255, 79, 163, .55));
}
#ui input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 12px; height: 12px; margin-top: -4.5px; border-radius: 50%;
  background: #f6efe4; border: 1px solid rgba(10, 12, 18, .6);
  box-shadow: 0 0 10px rgba(255, 180, 107, .55);
  transition: transform .15s ease;
}
#ui input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.15); }
#ui input[type="range"]::-moz-range-track {
  height: 3px; border-radius: 3px;
  background: linear-gradient(90deg, rgba(255, 180, 107, .85), rgba(255, 79, 163, .55));
}
#ui input[type="range"]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: #f6efe4; border: 1px solid rgba(10, 12, 18, .6);
  box-shadow: 0 0 10px rgba(255, 180, 107, .55);
}
button:focus-visible, input:focus-visible { outline: 1px solid rgba(255, 180, 107, .65); outline-offset: 3px; }

/* ---------- fps readout ---------- */
#fps {
  position: fixed; top: 12px; right: 14px; z-index: 35; display: none;
  padding: 5px 9px; border-radius: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 11px; letter-spacing: .03em; color: #7f8a9d;
  background: rgba(13, 16, 23, .55); border: 1px solid rgba(255, 255, 255, .07);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
#fps.show { display: block; }
body.uihidden #fps { opacity: 0; pointer-events: none; }

/* ---------- hint line ---------- */
#hint {
  position: fixed; left: 20px; bottom: 20px; z-index: 30;
  max-width: 48ch; font-size: 11px; letter-spacing: .05em; line-height: 1.5;
  color: rgba(186, 197, 214, .55);
  opacity: 0; transform: translateY(6px); pointer-events: none;
  transition: opacity .9s ease, transform .9s ease;
}
body.ready #hint { opacity: .85; transform: translateY(0); }
body.uihidden #hint { opacity: 0; transform: translateY(6px); }
body.nogl #hint { display: none; }

@media (prefers-reduced-motion: reduce) {
  .fb-rain.r1, .fb-rain.r2, .ld-bar > i { animation: none; }
  #ui, #hint, #loading { transition-duration: .01ms !important; }
}
</style>
</head>

varying vec2 vUv;      // raw pane uv, 0..1, y up
varying vec2 vPaneUv; // pane-normalised, aspect-corrected, origin pane centre

uniform float uAspect;
uniform vec2  uWinMin;
uniform vec2  uWinMax;

void main() {

uniform sampler2D uScene;
uniform float uTime;
uniform vec2  uResolution;
uniform float uAspect;
uniform float uRain;
uniform float uFog;
uniform vec4  uWipe;
uniform vec2  uBulb;
uniform vec2  uWinMin;
uniform vec2  uWinMax;

varying vec2 vUv;
varying vec2 vPaneUv;

const float PI = 3.14159265;

// ------------------------------------------------------------- hash/noise
float hash11(float p) {
  p = fract(p * 0.1031);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}

vec2 hash22(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash12(i);
  float b = hash12(i + vec2(1.0, 0.0));
  float c = hash12(i + vec2(0.0, 1.0));
  float d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
  float sum = 0.0;
  float amp = 0.5;
  for (int i = 0; i < 4; i++) {
    sum += amp * noise(p);
    p = p * 2.02 + vec2(11.3, 7.9);
    amp *= 0.5;
  }
  return sum;
}

// ------------------------------------------------------------ rain drops
struct Drop {
  vec2  uv;    // distorted scene uv to sample
  vec3  rgb;   // additive shading (body tint, rim, specular, trail walls)
  float alpha; // coverage within this layer
  float dry;   // how much condensation this layer clears (trails)
};

// One grid layer of raindrops: lens inversion + rim refraction + specular,
// plus a downward trail for a subset of cells. Small cells fall faster.
Drop dropLayer(vec2 uv, float t, float scale, float trailProb, float lensPower, float radMul, float spd) {
  Drop o;
  o.uv = uv;
  o.rgb = vec3(0.0);
  o.alpha = 0.0;
  o.dry = 0.0;

  vec2 st = uv * scale;
  vec2 id = floor(st);
  vec2 f = fract(st);
  vec2 rnd = hash22(id);
  float ph = hash11(id.x * 7.1 + id.y * 13.3);

  // jittered centre in the cell; rain falls downward = f.y decreases with t
  vec2 c = vec2(0.2 + 0.6 * rnd.x, fract(-t * spd * (0.03 + 0.05 * rnd.y) + rnd.x * 7.0));
  // slow sideways crawl so streaks are never perfectly vertical
  c.x += (noise(vec2(id.x * 3.7 + rnd.y * 10.0 + ph, t * 0.08)) - 0.5) * 0.12;

  float r = (0.35 + 0.15 * rnd.x) * 0.5 * radMul; // fraction of the half-cell
  vec2 d = f - c;
  float dist = length(d);

  if (dist < r) {
    vec2 dn = d / r;
    float k = max(1.0 - dot(dn, dn), 0.0);
    vec3 n = normalize(vec3(dn, sqrt(k) + 0.0001));

    vec2 centre = (id + c) / scale;      // drop centre in pane uv
    // inverted, magnified lens image ...
    vec2 lensUv = centre - (uv - centre) * (0.35 + 0.30 * rnd.x);
    // ... plus rim refraction, stronger in heavy rain
    o.uv = lensUv - n.xy * (r / scale) * lensPower * (0.25 + 0.5 * uRain);

    float body = 1.0 - smoothstep(r * 0.55, r, dist);
    float ring = smoothstep(r * 0.72, r, dist);            // rim darkening
    vec3 H = normalize(vec3(0.35, 0.55, 0.75));            // fixed light dir
    float spec = pow(max(dot(n, H), 0.0), 24.0) * 0.8;
    o.rgb = vec3(0.02, 0.03, 0.045) * body - vec3(0.09) * ring + vec3(spec);
    o.alpha = body;
  }

  // trail: cleared channel below the drop, beaded residue, bright walls
  if (hash12(id + 13.7) < trailProb && f.y < c.y) {
    float chan = 0.05 + 0.04 * noise(vec2(id.x, f.y * scale * 2.0)) + 0.008 * sin(PI * f.y * 40.0);
    float dw = abs(f.x - c.x);
    if (dw < chan) {
      float below = (c.y - f.y) / 0.55;            // fades along the streak
      float fade = 1.0 - clamp(below, 0.0, 1.0);
      float trk = (1.0 - smoothstep(chan * 0.25, chan, dw)) * fade;
      float by = floor(f.y * 26.0);                // beads on quantised y
      float bead = hash12(id + vec2(by, by * 1.7));
      trk *= mix(0.25, 1.0, step(0.4, bead));
      float wq = (dw - chan * 0.72) * 24.0;        // thin lit channel wall
      float wall = exp(-wq * wq);
      o.uv = mix(o.uv, uv, trk * 0.85);            // trails refract much less
      o.rgb += vec3(0.06, 0.055, 0.05) * trk * 0.6 + vec3(1.0, 0.9, 0.72) * wall * 0.10 * fade;
      o.alpha = max(o.alpha, trk * 0.7);
      o.dry = max(o.dry, trk * fade * 0.8);
    }
  }

  return o;
}

// ------------------------------------------------------------------- main
void main() {
  vec2 uv = vUv;

  // pane mask: the glass only exists inside the window rectangle
  vec2 beyond = max(uWinMin - uv, uv - uWinMax);
  vec3 outCol = texture2D(uScene, uv).rgb; // wall panels pass straight through

    vec2 de = min(uv - uWinMin, uWinMax - uv);   // distance to pane edge
    float deMin = min(de.x, de.y);
    vec2 px = 1.0 / uResolution;                 // 1px feather at the edges
    float mask = smoothstep(0.0, px.x, de.x) * smoothstep(0.0, px.y, de.y);

    Drop d2 = dropLayer(uv, uTime, 11.0, 0.40, 0.75, 0.85, 1.25);
    Drop d3 = dropLayer(uv, uTime, 22.0, 0.25, 0.50, 0.70, 1.90);
    Drop d4 = dropLayer(uv, uTime, 40.0, 0.00, 0.15, 0.48, 0.35); // micro specks
    vec2 uvR = d4.uv;
    uvR = mix(uvR, d3.uv, d3.alpha);
    uvR = mix(uvR, d2.uv, d2.alpha);
    uvR = mix(uvR, d1.uv, d1.alpha);
    float dry = d1.dry + d2.dry + d3.dry;        // trails dry the glass

    // ------------------------------------------- pointer wipe + regrowth
    vec2 wuv = (uv - uWipe.xy) * vec2(uAspect, 1.0);
    float wd = 1.0 - smoothstep(0.0, 0.10, length(wuv));
    float regrow = clamp((uWipe.z - 2.5) / 6.0, 0.0, 1.0); // haze returns
    float fogRegen = mix(0.25, 1.0, regrow);
    fog = max(fog - wd * uWipe.w * 0.9, fbm(uv * 5.0) * 0.25 * fogRegen);
    fog = clamp(fog * fogRegen * (1.0 - 0.6 * clamp(dry, 0.0, 1.0)), 0.0, 1.0) * clamp(uFog, 0.0, 1.5);

    vec2 texel = 1.0 / uResolution;
    vec3 sceneCol = texture2D(uScene, uvR).rgb;
    vec3 blurred = texture2D(uScene, uvR + vec2(texel.x * 3.0, 0.0)).rgb;

    blurred += texture2D(uScene, uvR - vec2(texel.x * 2.0, texel.y * 2.0)).rgb;
    sceneCol = mix(sceneCol, blurred / 3.0, fog * 0.85);

    // drop shading (specular, rim, trails)

    // ------------------------------------------ interior light / sheen --

    col = mix(col, reflCol, reflAmt);

    col += grain * 0.015;

  }

  gl_FragColor = vec4(outCol, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}
`;

    updateResolution();
    updateProjection();
  }
  if (ctx.regResize.length <= 1) ctx.regResize(onResize);
  else ctx.regResize('glass', onResize);

    lf.position.set(Math.cos(a) * 0.075, 0.18 + i * 0.05 + (i % 2) * 0.022, Math.sin(a) * 0.075);
    lf.rotation.y = a;
    lf.rotation.z = 0.22 + (i % 3) * 0.13;
    plant.add(lf);
  }

  const bp = W.bulb;
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0035, 1.64, 6), basic(0x0b0d11));
  cord.position.set(bp.x, 1.88, bp.z);
  FG.add(cord);
  const bulbMat = basic(0xffffff);
  bulbMat.color.copy(bulbWarm).multiplyScalar(2.2);
  const bulbMesh = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 12), bulbMat);
  bulbMesh.position.set(bp.x, bp.y, bp.z);
  FG.add(bulbMesh);
  const fil = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.004, 0.004), basic(0xffe9b8));
  fil.position.set(bp.x, bp.y, bp.z);
  FG.add(fil);
  const bulbGlow = glowSprite(glowTex, 0.9, 0.5, pal.amber);
  bulbGlow.position.set(bp.x, bp.y, bp.z);
  FG.add(bulbGlow);

  try {
    const L = ui.loading;
    if (L) {
      L.style.opacity = '0';
      setTimeout(function () {
        try { L.style.display = 'none'; } catch (e) {}
      }, 500);
    }
  } catch (e) {}

  let ac = null;
  let audio = null;
  let thunderTimer = 0;

  function noiseBuffer(seconds) {
    const sr = ac.sampleRate;
    const len = Math.max(1, Math.floor(sr * seconds));
    const b = ac.createBuffer(1, len, sr);
    const ch = b.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    return b;
  }
  function filt(type, freq, q) {
    const f = ac.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    if (q !== undefined) f.Q.value = q;
    return f;
  }
  function gain(v) {
    const g = ac.createGain();
    g.gain.value = v;
    return g;
  }

  function thunder() {
    try {
      if (ac && ctx.params.sound && audio) {
        const t0 = ac.currentTime;
        const b = noiseBuffer(2.5);
        const ch = b.getChannelData(0);
        for (let i = 0; i < ch.length; i++) {
          const p = i / ch.length;
          ch[i] = ch[i] * (1 - p) * (1 - p) + Math.sin(i * 0.004) * 0.3 * (1 - p);
        }
        const s = ac.createBufferSource();
        s.buffer = b;
        const g = gain(0);
        g.gain.setValueAtTime(0.5, t0);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + 2.5);
        s.connect(filt('lowpass', 180)).connect(g).connect(audio.master);
        s.start(t0);
        s.stop(t0 + 2.6);
        const s2 = ac.createBufferSource();
        s2.buffer = b;
        const g2 = gain(0);
        g2.gain.setValueAtTime(0.3, t0);
        g2.gain.exponentialRampToValueAtTime(0.001, t0 + 2.5);
        s2.connect(filt('bandpass', 90, 0.7)).connect(g2).connect(audio.master);
        s2.start(t0 + 0.05);
        s2.stop(t0 + 2.7);
      }
    } catch (e) {}
    if (ctx.params.sound) thunderTimer = setTimeout(thunder, 24000 + Math.random() * 46000);
    else thunderTimer = 0;
  }

  function audioOn() {
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        ac = new AC();
        const master = gain(0.9);
        master.connect(ac.destination);
        const nb = noiseBuffer(2);
        function src() {
          const s = ac.createBufferSource();
          s.buffer = nb;
          s.loop = true;
          return s;
        }
        const n1 = src();
        const gRain = gain(0.16);
        n1.connect(filt('lowpass', 900, 0.4)).connect(gRain).connect(master);
        const n2 = src();
        const gHiss = gain(0.025);
        n2.connect(filt('bandpass', 2400, 0.8)).connect(gHiss).connect(master);
        const lfo = ac.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 0.07;
        lfo.connect(gain(0.16 * 0.3)).connect(gRain.gain);
        const hums = [];
        const humSpec = [[58, 0.012], [117, 0.006]];
        for (let i = 0; i < humSpec.length; i++) {
          const o = ac.createOscillator();
          o.type = 'sine';
          o.frequency.value = humSpec[i][0];
          o.connect(gain(humSpec[i][1])).connect(master);
          hums.push(o);
        }
        audio = { master: master, nodes: [n1, n2, lfo].concat(hums) };
        n1.start();
        n2.start();
        lfo.start();
        for (let i = 0; i < hums.length; i++) hums[i].start();
      }
      if (ac.state === 'suspended') ac.resume();
      if (!thunderTimer) thunderTimer = setTimeout(thunder, 3000 + Math.random() * 12000);
      return true;
    } catch (e) {
      return false;
    }
  }

  function audioOff() {
    try {
      if (thunderTimer) clearTimeout(thunderTimer);
      thunderTimer = 0;
    } catch (e) {}
    try {
      if (audio && audio.nodes) {
        for (let i = 0; i < audio.nodes.length; i++) {
          try { audio.nodes[i].stop(); } catch (e) {}
        }
      }
    } catch (e) {}
    try {
      if (ac) ac.close();
    } catch (e) {}
    ac = null;
    audio = null;
  }

  function setSound(on) {
    try {
      if (on) ctx.params.sound = audioOn();
      else {
        audioOff();
        ctx.params.sound = false;
      }
    } catch (e) {
      ctx.params.sound = false;
    }
    try {
      if (ui.btnSound) ui.btnSound.textContent = 'Sound: ' + (ctx.params.sound ? 'On' : 'Off');
    } catch (e) {}
  }

  try {
    if (ui.btnSound) ui.btnSound.textContent = 'Sound: ' + (ctx.params.sound ? 'On' : 'Off');
    if (ui.sldRain && ctx.params.rain !== undefined) ui.sldRain.value = String(Math.round(ctx.params.rain * 100));
    if (ui.sldFog && ctx.params.fog !== undefined) ui.sldFog.value = String(Math.round(ctx.params.fog * 100));
  } catch (e) {}

  if (ui.btnSound) ui.btnSound.addEventListener('click', function () {
    setSound(!ctx.params.sound);
  });
  if (ui.sldRain) ui.sldRain.addEventListener('input', function () {
    const v = parseFloat(ui.sldRain.value) || 0;
    ctx.params.rain = v / 100;
    ctx.params.rainSpeed = 0.6 + 0.8 * ctx.params.rain;
  });
  if (ui.sldFog) ui.sldFog.addEventListener('input', function () {
    ctx.params.fog = (parseFloat(ui.sldFog.value) || 0) / 100;
  });

  let sweep = null;
  if (ui.btnWipe) ui.btnWipe.addEventListener('click', function () {
    sweep = { t0: performance.now() / 1000, dur: 1.4 };
  });

  function setHint(hidden) {
    try {
      if (ui.hint) {
        ui.hint.classList.toggle('faded', hidden);
        ui.hint.style.opacity = hidden ? '0' : '';
      }
    } catch (e) {}
  }
  let hintTimer = setTimeout(function () { setHint(true); }, 7000);
  function armHint() {
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { setHint(true); }, 7000);
  }

  function setUiHidden(hidden) {
    try {
      const els = [ui.btnSound, ui.btnWipe, ui.sldRain, ui.sldFog, ui.fps];
      for (let i = 0; i < els.length; i++) {
        if (els[i]) els[i].style.display = hidden ? 'none' : '';
      }
    } catch (e) {}
  }

  function writeUV(e) {
    ctx.wipe.x = e.clientX / window.innerWidth;
    ctx.wipe.y = 1 - e.clientY / window.innerHeight;
    ctx.wipe.t = performance.now() / 1000;
  }

  if (canvas) {
    canvas.addEventListener('pointerdown', function (e) {
      try {
        e.preventDefault();
        canvas.setPointerCapture(e.pointerId);
      } catch (err) {}
      ctx.wipe.active = true;
      writeUV(e);
      setHint(false);
      armHint();
    });
    canvas.addEventListener('pointermove', writeUV);
    canvas.addEventListener('pointerup', function (e) {
      ctx.wipe.active = false;
      writeUV(e);
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
    });
    canvas.addEventListener('pointercancel', function (e) {
      ctx.wipe.active = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
    });
    canvas.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });
  }

  window.addEventListener('keydown', function (e) {
    const tgt = e.target;
    const tag = tgt && tgt.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (tgt && tgt.isContentEditable)) return;
    const k = e.key === 's' || e.key === 'S' ? 's'
      : (e.key === 'f' || e.key === 'F' ? 'f'
      : (e.key === 'h' || e.key === 'H' ? 'h' : ''));
    if (k === 's') {
      setSound(!ctx.params.sound);
    } else if (k === 'h') {
      const hidden = !document.body.classList.contains('uihidden');
      document.body.classList.toggle('uihidden', hidden);
      setUiHidden(hidden);
    } else if (k === 'f') {
      try {
        if (ui.fps) ui.fps.style.display = ui.fps.style.display === 'none' ? '' : 'none';
      } catch (err) {}
    }
  });

  function tick(dt, t) {
    for (let i = 0; i < steam.length; i++) {
      const s = steam[i];
      let p = (t * s.spd + s.ph) % 1;
      if (p < 0) p += 1;
      const sc = 0.05 + p * 0.3;
      s.spr.position.set(
        cupX + Math.sin(t + s.ph * 6.2831) * 0.01,
        0.9 + p * 0.55,
        cupZ + Math.cos(t * 0.8 + s.ph * 6.2831) * 0.006
      );
      s.spr.scale.set(sc, sc, 1);
      s.spr.material.opacity = s.op * (1 - p);
    }
    if (sweep) {
      const now = performance.now() / 1000;
      const e = (now - sweep.t0) / sweep.dur;
      if (e >= 1) {
        sweep = null;
        ctx.wipe.active = false;
      } else {
        ctx.wipe.x = e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
        ctx.wipe.y = 0.5;
        ctx.wipe.t = now;
        ctx.wipe.active = true;
      }
    }
    const fl = 0.93 + 0.07 * Math.sin(t * 11.3) * Math.sin(t * 4.1 + 1.7);
    bulbGlow.material.opacity = 0.5 * fl;
    bulbMat.color.copy(bulbWarm).multiplyScalar(2.2 * fl);
  }
  try {
    ctx.regTick('ui', tick);
  } catch (e) {}
});



function showFallback(msg) {
  if (msg) window.__errors.push(String(msg));
  document.body.classList.add('nogl');
  const fb = $('fallback');
  if (fb) fb.classList.add('show');
  const ld = $('loading');
  if (ld) ld.style.display = 'none';
  window.__ready = false;
}

function boot(THREE) {
  ctx.THREE = THREE;

  ctx.radialTexture = function (hexColor, size, falloff) {
    const S = Math.max(8, size || 128);
    const F = falloff === undefined ? 1 : Math.min(1, Math.max(0, falloff));
    const hex = new THREE.Color(hexColor).getHexString();
    const cr = parseInt(hex.slice(0, 2), 16);
    const cg = parseInt(hex.slice(2, 4), 16);
    const cb = parseInt(hex.slice(4, 6), 16);
    const cv = ctx.canvas2d(S, S, function (g, w, h) {
      const cx = w / 2;
      const cy = h / 2;
      const R = Math.min(cx, cy);
      const grad = g.createRadialGradient(cx, cy, R * (1 - F), cx, cy, R);
      const rgb = cr + ',' + cg + ',' + cb;
      grad.addColorStop(0, 'rgba(' + rgb + ',1)');
      grad.addColorStop(1, 'rgba(' + rgb + ',0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
    });
    return new THREE.CanvasTexture(cv);
  };

  ctx.w = Math.max(1, window.innerWidth);
  ctx.h = Math.max(1, window.innerHeight);
  ctx.pr = Math.min(window.devicePixelRatio || 1, 2);

  try {
    ctx.renderer = new THREE.WebGLRenderer({
      canvas: ctx.canvas,
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance'
    });
  } catch (e) {
    window.__errors.push('renderer creation failed: ' + e);
    showFallback('WebGL unavailable');
    return;
  }

  ctx.renderer.setPixelRatio(ctx.pr);
  ctx.renderer.setSize(ctx.w, ctx.h, false);
  ctx.renderer.toneMapping = THREE.ACESFilmicToneMapping;
  ctx.renderer.toneMappingExposure = 1.2;
  ctx.renderer.outputColorSpace = THREE.SRGBColorSpace;
  ctx.renderer.autoClear = false;
  ctx.renderer.setClearColor(new THREE.Color(W.fog), 1);

  ctx.sceneRT = new THREE.Scene();
  ctx.sceneFG = new THREE.Scene();
  ctx.sceneGlass = new THREE.Scene();
  ctx.glassCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  ctx.camera = new THREE.PerspectiveCamera(55, ctx.w / ctx.h, 0.1, 300);
  ctx.camera.position.set(W.camPos[0], W.camPos[1], W.camPos[2]);
  ctx.camera.lookAt(new THREE.Vector3(W.lookAt[0], W.lookAt[1], W.lookAt[2]));
  ctx.sceneRT.fog = new THREE.Fog(W.fog, W.fogNear, W.fogFar);

  ctx.rtScene = new THREE.WebGLRenderTarget(
    Math.max(1, Math.round(ctx.w * ctx.pr)),
    Math.max(1, Math.round(ctx.h * ctx.pr)),
    {
      type: THREE.HalfFloatType,
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      depthBuffer: true
    }
  );

  const glassMat = new THREE.MeshBasicMaterial({ color: 0x0a0d16 });
  glassMat.depthTest = false;
  glassMat.depthWrite = false;
  ctx.glassQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), glassMat);
  ctx.glassQuad.renderOrder = 0;
  ctx.glassQuad.frustumCulled = false;
  ctx.sceneGlass.add(ctx.glassQuad);

  function syncSceneTexture() {
    try {
      const m = ctx.glassQuad && ctx.glassQuad.material;
      if (m && m.uniforms && m.uniforms.uScene) m.uniforms.uScene.value = ctx.rtScene.texture;
    } catch (e) {}
  }

  function rebuildRT() {
    if (ctx.rtScene) ctx.rtScene.dispose();
    ctx.rtScene = new THREE.WebGLRenderTarget(
      Math.max(1, Math.round(ctx.w * ctx.pr)),
      Math.max(1, Math.round(ctx.h * ctx.pr)),
      {
        type: THREE.HalfFloatType,
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
        depthBuffer: true
      }
    );
    syncSceneTexture();
  }
  ctx.rebuildRT = rebuildRT;

  function runSections() {
    for (let i = 0; i < SECTIONS.length; i++) {
      const fn = SECTIONS[i];
      const name = fn.name || ('section_' + (i + 1));
      try {
        fn(ctx);
        ctx.sectionStatus[name] = 'ok';
      } catch (e) {
        ctx.sectionStatus[name] = 'failed';
        window.__errors.push('section ' + name + ' failed: ' + e);
      }
    }
  }

  function applySize() {
    ctx.w = Math.max(1, window.innerWidth);
    ctx.h = Math.max(1, window.innerHeight);
    const cap = ctx.quality > 0.75 ? 2 : 1;
    ctx.pr = Math.min(window.devicePixelRatio || 1, cap);
    ctx.camera.aspect = ctx.w / ctx.h;
    ctx.camera.updateProjectionMatrix();
    ctx.renderer.setPixelRatio(ctx.pr);
    ctx.renderer.setSize(ctx.w, ctx.h, false);
    rebuildRT();
    for (let i = 0; i < ctx._resizes.length; i++) {
      try {
        ctx._resizes[i](ctx.w, ctx.h, ctx.pr);
      } catch (e) {
        window.__errors.push('resize callback failed: ' + e);
      }
    }
  }

  let resizeTimer = 0;
  const queueResize = function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(applySize, 100);
  };
  window.addEventListener('resize', queueResize);
  window.addEventListener('orientationchange', queueResize);

  window.__diag = function () {
    const r = ctx.renderer;
    return {
      fps: ctx.fps,
      avgFrameMs: ctx.avgFrameMs,
      drawCalls: r ? r.info.render.calls : 0,
      triangles: r ? r.info.render.triangles : 0,
      pixelRatio: ctx.pr,
      quality: ctx.quality,
      sections: ctx.sectionStatus,
      errors: window.__errors,
      webgl2: r ? r.capabilities.isWebGL2 === true : false
    };
  };
  window.__ctx = ctx;

  window.__debugSnap = function () {
    try {
      var R = ctx.renderer, T = ctx.THREE, three = T;
      var w = R.domElement.width, h = R.domElement.height;
      R.setRenderTarget(ctx.rtScene); R.clear(true, true, false); R.render(ctx.sceneRT, ctx.camera);
      R.setRenderTarget(null); R.clear(true, true, false);
      R.render(ctx.sceneGlass, ctx.glassCam);
      R.clearDepth(); R.render(ctx.sceneFG, ctx.camera);
      var gl = R.getContext(); var buf = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      var c2 = document.createElement('canvas'); c2.width = w; c2.height = h;
      var g = c2.getContext('2d'); var img = g.createImageData(w, h);
      for (var y = 0; y < h; y++) { var s = (h - 1 - y) * w * 4, d = y * w * 4; img.data.set(buf.subarray(s, s + w * 4), d); }
      g.putImageData(img, 0, 0);
      var url = c2.toDataURL('image/png');
      // cheap stats to detect black/stale frames without leaving the page
      var sum = 0, min = 255, max = 0, n = w * h;
      for (var i = 0; i < n; i++) { var v = buf[i * 4]; sum += v; if (v < min) min = v; if (v > max) max = v; }
      return { w: w, h: h, mean: +(sum / n).toFixed(2), min: min, max: max, dataURL: url };
    } catch (e) { return { error: String(e) }; }
  };

  runSections();

  function startLoop() {
    if (!ctx.renderer || !ctx.rtScene || !ctx.sceneRT || !ctx.sceneFG) return;
    const clock = new THREE.Clock();
    let okFrames = 0;
    let hidden = false;
    let qualityDropped = false;
    let timerAcc = 0;
    const ftimes = [];

    document.addEventListener('visibilitychange', function () {
      hidden = document.hidden;
      if (!hidden) clock.getDelta();
    });

    const loggedTickErrors = {};
    const loggedRenderErrors = {};

    function frame() {
      requestAnimationFrame(frame);
      if (hidden || document.hidden) return;

      try {
        const dt = Math.min(clock.getDelta(), 0.05);
        ctx.time += dt;

        // (i) pass orchestration render FIRST
        ctx.renderer.setRenderTarget(ctx.rtScene);
        ctx.renderer.clear();
        ctx.renderer.render(ctx.sceneRT, ctx.camera);
        ctx.renderer.setRenderTarget(null);
        ctx.renderer.clear();
        if (ctx.glassPass && typeof ctx.glassPass.fn === 'function') {
          ctx.glassPass.fn(dt, ctx.time);
        }
        ctx.renderer.clearDepth();
        ctx.renderer.render(ctx.sceneFG, ctx.camera);

        // (ii) registered ticks, each isolated: log once per callback, never break the loop
        const ticks = ctx._ticks;
        for (let i = 0; i < ticks.length; i++) {
          const tickFn = ticks[i];
          if (typeof tickFn !== 'function') continue;
          try {
            tickFn(dt, ctx.time);
          } catch (e) {
            const nm = tickFn.name || ('tick#' + i);
            if (!loggedTickErrors[nm]) {
              loggedTickErrors[nm] = true;
              window.__errors.push('tick ' + nm + ' failed: ' + e);
            }
          }
        }

        // (iii) fps / diag bookkeeping
        okFrames++;
        if (okFrames === 3) {
          document.body.classList.add('ready');
          window.__ready = true;
        }

        ftimes.push(dt * 1000);
        if (ftimes.length > 120) ftimes.shift();
        timerAcc += dt;
        if (timerAcc >= 0.5) {
          timerAcc = 0;
          let sum = 0;
          for (let i = 0; i < ftimes.length; i++) sum += ftimes[i];
          const avg = ftimes.length ? sum / ftimes.length : 0;
          ctx.avgFrameMs = Math.round(avg * 100) / 100;
          ctx.fps = Math.round(1000 / Math.max(0.5, avg));
          if (ctx.ui && ctx.ui.fps) {
            ctx.ui.fps.textContent = ctx.fps + ' fps · ' + ctx.avgFrameMs.toFixed(1) + ' ms';
          }
          if (!qualityDropped && ftimes.length >= 120 && avg > 24 && ctx.quality > 0.75) {
            qualityDropped = true;
            ctx.quality = 0.5;
            ctx.pr = 1;
            ctx.renderer.setPixelRatio(1);
            ctx.renderer.setSize(ctx.w, ctx.h, false);
            rebuildRT();
            ctx.qualityChanged = true;
            for (let i = 0; i < ctx.onQuality.length; i++) {
              try { ctx.onQuality[i](ctx.quality); } catch (e) {}
            }
          }
        }
      } catch (e) {
        const msg = 'render frame failed: ' + e;
        if (!loggedRenderErrors[msg]) {
          loggedRenderErrors[msg] = true;
          window.__errors.push(msg);
        }
      }
    }
    frame();
  }

  startLoop();
}

try {
  const threeModule = await import('three');
  boot(threeModule);
} catch (e) {
  window.__errors.push('three import failed: ' + e);
  showFallback();
}
